[package]
name = "zcode-switch"
version = "1.8.3-Z.EMAIL"
description = "ZCode 账号切换器"
license = "MIT"
edition = "2021"

[lib]
name = "zcode_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# native-tls 在 Windows 上走 Schannel，指纹与系统客户端一致（ureq 需显式在 AgentBuilder 上挂 connector）。
# 参考 PR#43：zcode.z.ai 前置 WAF 会因 TLS 指纹静默降级，双通道（curl + native-tls）互为兜底。
ureq = { version = "2", features = ["json", "native-tls"] }
native-tls = "0.2"
sys-locale = "0.3"
# 本地网关（测试版反代）：它是全项目唯一异步、唯一流式的地方，所以另起一套。
# reqwest 默认走 native-tls，Windows 上就是 Schannel，与上面 ureq 的选择一致。
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# 原生玻璃（glass.rs）：NSGlassEffectView / NSVisualEffectView 挂在 WKWebView 下方
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSGraphics", "NSAppearance", "NSGlassEffectView", "NSVisualEffectView", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "CGPath"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }

[target.'cfg(not(windows))'.dependencies]
# X-Client-Timezone 的 IANA 名（Node Intl 同源）
iana-time-zone = "0.1"

[profile.release]
strip = "symbols"
lto = "thin"

# --- 构建产物体积控制 ---
# 2026-11 实测：一次正常开发后 target/debug 涨到 8.16 GB，其中
# .rlib 2.26 GB / .lib 2.16 GB / .pdb 1.54 GB / .o 0.85 GB / .rmeta 0.79 GB / incremental 1.11 GB，
# 大头是依赖 crate 的调试信息。依赖不需要调试信息（要断点的是本仓库的代码），
# 自己的 crate 只保留行号表，栈回溯与 file:line 照样准确。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
